# To add or remove a plugin/marketplace, edit the arrays below and re-apply
# (`chezmoi apply` / `chezmoi update`); the provisioner re-runs on any change.
# Entries under [claude.identities.<identity>] are added only on that identity.

[claude]
plugins = [
  "gopls-lsp@claude-plugins-official",
  "typescript-lsp@claude-plugins-official",
  "code-simplifier@claude-plugins-official",
  "frontend-design@claude-plugins-official",
  "mattpocock-skills@mattpocock",
  "modern-web-guidance@googlechrome",
  "plannotator@plannotator",
]

[claude.marketplaces]
googlechrome = "GoogleChrome/modern-web-guidance"
mattpocock = "mattpocock/skills"
plannotator = "backnotprop/plannotator"

[claude.identities.kirbtech]
plugins = ["kirbtech-skills@kirbtech"]
marketplaces = { kirbtech = "kirbtech/skills" }
