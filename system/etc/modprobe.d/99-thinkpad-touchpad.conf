# ThinkPad T14 Gen 2i (Synaptics LEN2072) — use the RMI4/SMBus transport
# instead of the legacy PS/2 fallback. The kernel asks for this itself:
#
#   psmouse serio1: synaptics: Your touchpad (PNP: LEN2072 PNP0f13) says it
#   can support a different bus. If i2c-hid and hid-rmi are not used, you
#   might want to try setting psmouse.synaptics_intertouch to 1
#
# PS/2 mode reports coarse coordinates and limited multitouch; RMI4 gives the
# touchpad's native resolution, real multi-finger data, and libinput's proper
# palm rejection. Delete this file and reboot to revert.
options psmouse synaptics_intertouch=1
